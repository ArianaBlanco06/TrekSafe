
name: TrekSafe CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - validaciones
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix backend
      
      - name: Verificar TypeScript
        run: npm run typecheck --prefix backend

      - name: Ejecutar pruebas
        run: npm test --prefix backend

      - name: Compilar backend
        run: npm run build --prefix backend

      - name: Probar idempotencia HU-49 en PostgreSQL desechable
        run: node backend/scripts/test-hu49-postgres.mjs --pg-bin "$(pg_config --bindir)"

      - name: Probar paginación y filtros HU-48 en PostgreSQL desechable
        run: node backend/scripts/test-hu48-postgres.mjs --pg-bin "$(pg_config --bindir)"

  frontend:
    name: Frontend - validaciones
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Instalar dependencias del backend para pruebas integradas
        run: npm ci --prefix backend

      - name: Verificar TypeScript
        run: npm run typecheck --prefix frontend

      - name: Verificar tipos de pruebas
        run: npm run typecheck:tests --prefix frontend

      - name: Verificar tipos de pruebas de puntos (HU-32)
        run: npm run typecheck:ui --prefix frontend

      - name: Ejecutar pruebas de equipo (HU-30)
        run: npm run test:equipo --prefix frontend

      - name: Validar destinos publicados y medición local de consultas
        run: |
          npm run test:publicado:config --prefix frontend
          npm run test:medicion:polling --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: /api

      - name: Instalar Chromium para pruebas PWA
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Probar interfaz de puntos (HU-32)
        run: npm run test:ui --prefix frontend

      - name: Probar privacidad con Service Worker activo
        run: npm run test:pwa:privacidad --prefix frontend

      - name: Adjuntar evidencia PWA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-privacidad-pwa
          path: frontend/test-results/
          if-no-files-found: ignore

  imagen_pr:
    name: Imagen - construir sin publicar
    if: github.event_name == 'pull_request'
    needs: [backend, frontend, persistencia]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verificar preflight sin credenciales reales
        run: python3 -m unittest discover -s deployment/oci -p test_preflight.py
      - name: Validar scripts de despliegue
        run: |
          bash -n deployment/oci/preflight.sh
          python3 -m py_compile deployment/oci/preflight.py deployment/oci/actualizar-duckdns.py deployment/oci/ghcr-private.py
      - name: Validar Compose con ejemplos sin secretos
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /etc/treksafe
          sudo install -m 600 deployment/oci/api.env.example /etc/treksafe/api.env
          sudo install -m 600 deployment/oci/worker.env.example /etc/treksafe/worker.env
          export TREKSAFE_IMAGE="ghcr.io/ficticio/treksafe-r2@sha256:$(printf 'a%.0s' {1..64})"
          export CADDY_IMAGE="caddy@sha256:$(printf 'b%.0s' {1..64})"
          export API_HOST=prueba.duckdns.org ACME_EMAIL=ficticio@example.invalid
          sudo --preserve-env=TREKSAFE_IMAGE,CADDY_IMAGE,API_HOST,ACME_EMAIL docker compose -f deployment/oci/compose.api.yml config --quiet
          sudo --preserve-env=TREKSAFE_IMAGE,CADDY_IMAGE,API_HOST,ACME_EMAIL docker compose -f deployment/oci/compose.worker.yml config --quiet
      - name: Construir imagen amd64 sin iniciar servicios ni usar secretos
        run: |
          docker build --platform linux/amd64 --build-arg VCS_REF="$GITHUB_SHA" -t treksafe-validacion:local backend
          docker run --rm treksafe-validacion:local node --check dist/api.js
          docker run --rm treksafe-validacion:local node --check dist/worker.js
          docker run --rm treksafe-validacion:local node --input-type=module -e "await import('./dist/api.js'); await import('./dist/worker.js')"

  imagen_publicada:
    name: Imagen - GHCR privado
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [backend, frontend, persistencia]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
    steps:
      - uses: actions/checkout@v7
      - name: Validar configuración de despliegue
        run: python3 -m unittest discover -s deployment/oci -p test_preflight.py
      - name: Bloquear reutilización de un paquete público
        run: python3 deployment/oci/ghcr-private.py
      - name: Construir, publicar y registrar digest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/treksafe-r2"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker build --platform linux/amd64 --build-arg VCS_REF="$GITHUB_SHA" -t "$image:$GITHUB_SHA" backend
          docker push "$image:$GITHUB_SHA"
          docker pull "$image:$GITHUB_SHA"
          digest="$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/treksafe-imagen"
          printf '%s\n' "commit=$GITHUB_SHA" "imagen=$digest" "plataforma=linux/amd64" > "$RUNNER_TEMP/treksafe-imagen/imagen.txt"
      - name: Confirmar paquete privado después de publicar
        run: python3 deployment/oci/ghcr-private.py --after-push
      - name: Conservar identidad de imagen; no desplegar máquinas
        uses: actions/upload-artifact@v4
        with:
          name: imagen-academica-${{ github.sha }}
          path: ${{ runner.temp }}/treksafe-imagen/imagen.txt
          retention-days: 7

  persistencia:
    name: Persistencia - PostgreSQL 17 y PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Instalar PostgreSQL 17 desde PGDG
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors --retry-delay 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | grep -F 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/treksafe-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          /usr/lib/postgresql/17/bin/pg_ctl --version

      - name: Descargar PostgREST 16.5 y verificar SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors --retry-delay 2 https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/postgrest.tar.xz"
          echo "5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/postgrest"
          "$RUNNER_TEMP/postgrest/postgrest" --version

      - name: Probar instalacion, actualizacion y RPC reales en base desechable
        shell: bash
        run: |
          set -euo pipefail
          node backend/scripts/test-dep108-postgres.mjs --pg-bin /usr/lib/postgresql/17/bin --postgrest "$RUNNER_TEMP/postgrest/postgrest" --dev-check backend/migrations/tests/dep108_dev_rollback.sql | tee "$RUNNER_TEMP/dep108.log"

      - name: Adjuntar evidencia de persistencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-persistencia-dep108
          path: ${{ runner.temp }}/dep108.log
          if-no-files-found: ignore
