
name: TrekSafe CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - validaciones
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Verificar TypeScript
        run: npm run typecheck --prefix backend

      - name: Ejecutar pruebas
        run: npm test --prefix backend

      - name: Compilar backend
        run: npm run build --prefix backend

  frontend:
    name: Frontend - validaciones
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Instalar backend para pruebas integradas de HU-30
        run: npm ci --prefix backend

      - name: Verificar TypeScript
        run: npm run typecheck --prefix frontend

      - name: Verificar tipos de pruebas
        run: npm run typecheck:tests --prefix frontend

      - name: Ejecutar pruebas TSX de HU-30
        run: npm run test:equipo --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: /api

      - name: Instalar Chromium para pruebas PWA
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Probar privacidad con Service Worker activo
        run: npm run test:pwa:privacidad --prefix frontend

      - name: Adjuntar evidencia PWA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-privacidad-pwa
          path: frontend/test-results/
          if-no-files-found: ignore
